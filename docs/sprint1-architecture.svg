<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Quick-Response Subcontracting Desk architecture</title>
<desc id="desc">Streamlit dispatcher desk, LangChain structured language interpretation, Python decision tools and dispatcher approval. Session memory supports interpretation, course data feeds tools, and SQLite stores confirmed decisions and queues. The shared simulator tests the same Python allocator.</desc>
