# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax for syntax.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# We only do tests; no need to write.
permissions:
  contents: read

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Clone the repo.
      - uses: actions/checkout@v7

      # Install uv.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked fails if uv.lock is stale relative to pyproject.toml.
      - name: Install (locked)
        run: uv sync --locked --all-groups

      # Basically: same pre-commit yaml -> same key -> reuse the installed hook environments,
      # otherwise clone and build them (and save under the new key).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the exact hooks we run locally, so CI matches the local hook exactly
      # (and catches anyone who skipped pre-commit install). Fails if any hook modified a file.
      - name: Check pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Paired notebooks are synced by hand (see README). But enforced here:
      # If the .py and .ipynb disagree, the sync produces a diff and we fail.
      - name: Notebooks in sync
        run: |
          find notebooks -name '*.ipynb' -exec uv run jupytext --sync {} +
          test -z "$(git status --porcelain -- notebooks/)"

      - name: Tests
        run: uv run pytest
