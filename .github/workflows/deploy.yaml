# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax for syntax.
#
# Building and deploying are split, because the instance is switched off when not
# needed. Merging should therefore not wake it.
#
#   push to main          -> build the image, push to ECR, stop there
#   Run workflow (manual) -> deploy an image that is already in ECR
#
#   runner                                      instance (EC2)
#     |-- docker build + push --> ECR               |          (build job)
#     |-- ssm send-command (a shell script) ------->|          (deploy job)
#     |                                    write compose files
#     |                                    fetch secrets from Parameter Store
#     |                                    docker compose pull && up -d
#     |<-- poll get-command-invocation --------------|
#     |-- curl http://<ip>/  (did it actually serve?)
#
# So every merge proves the image still builds, and we deploy after starting
# the instance. The runner never holds an AWS key (OIDC) and never sees the app's
# secrets (the instance fetches those).
name: Deploy app

on:
  push:
    branches: [main]
    paths:
      # Everything baked into the image. track2/ and examples/ are included
      # because the app reads them at runtime, so a change there really does
      # change the deployed system.
      - "src/**"
      - "track2/**"
      - "examples/**"
      - ".streamlit/**"
      - "streamlit_app.py"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Leave empty to deploy the current commit. Put an older commit SHA here to roll back."
        required: false
        default: ""

permissions:
  id-token: write # Mint the OIDC token AWS checks against the role's trust policy.
  contents: read

# Unlike CI, a deploy in flight must not be cancelled: it would leave the
# instance half updated. Queue instead.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: dss5105 # Also the tag AWS resources carry, which is how they are found below.

jobs:
  # On push: build only.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Clone the repo.
      - uses: actions/checkout@v7

      # Configure AWS cred. using variables stored in GitHub.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Log docker in to ECR. Exposes the registry host as steps.ecr.outputs.registry.
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit SHA, which is also what the deploy job asks for.
      # The build context is the repo root because the app reads track2/ and
      # examples/ relative to it; see infra/Dockerfile.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f infra/Dockerfile -t "$REGISTRY/$PROJECT-app:$GITHUB_SHA" .
          docker push "$REGISTRY/$PROJECT-app:$GITHUB_SHA"
          echo "### Built \`$GITHUB_SHA\`. Run this workflow manually to deploy it." \
            >> "$GITHUB_STEP_SUMMARY"

  # On manual run: deploy an image that already exists.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Clone the repo.
      - uses: actions/checkout@v7

      # Configure AWS cred. using variables stored in GitHub.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Log docker in to ECR. Exposes the registry host as steps.ecr.outputs.registry.
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Two modes, chosen by the tag input:
      #   | tag input | deploys                        | meaning               |
      #   |-----------|--------------------------------|-----------------------|
      #   | empty     | the commit you dispatched from | ship the current code |
      #   | a SHA     | that commit's image            | roll back to it       |
      #
      # Nothing is built here, so the image has to be in ECR already: the push
      # that merged the commit is what built it. batch-get-image rather than
      # describe-images, because the deploy role is not granted ecr:DescribeImages
      # for least privilege reasons.
      - name: Resolve and verify the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_SHA}"
          FOUND=$(aws ecr batch-get-image --repository-name "$PROJECT-app" \
            --image-ids imageTag="$TAG" --query 'length(images)' --output text)
          if [ "$FOUND" = "0" ]; then
            echo "::error::No image tagged $TAG in ECR. Merge a change that triggers a build," \
                 "or pass a tag that was built."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # No SSH: we hand a script to SSM and it runs as root on the instance.
      # The instance is found by its Project tag, which is also what scopes the
      # deploy role's permission to send it anything at all.
      - name: Deploy to EC2 via SSM
        id: ssm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=$PROJECT" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running instance. Run the 'Power' workflow with 'start' first."
            exit 1
          fi

          # The instance has no copy of the repo, so the three config files are
          # shipped inline. base64 keeps newlines and quoting intact through the
          # heredoc and the JSON below.
          COMPOSE_B64=$(base64 -w0 infra/compose.yaml)
          PROD_B64=$(base64 -w0 infra/compose.prod.yaml)
          CADDY_B64=$(base64 -w0 infra/Caddyfile)

          # Script that runs ON the instance. Runner-side values are filled in here.
          # Note there is no `set -x`: the SSM output is echoed into this log, and
          # the secret fetched below must never appear in it.
          cat > remote.sh <<EOF
          set -euo pipefail
          umask 077
          cd /opt/app
          echo '$COMPOSE_B64' | base64 -d > compose.yaml
          echo '$PROD_B64' | base64 -d > compose.prod.yaml
          echo '$CADDY_B64' | base64 -d > Caddyfile

          # compose's own interpolation file. Rewritten every deploy.
          printf 'REGISTRY=%s\nTAG=%s\nSITE_ADDRESS=%s\n' '$REGISTRY' '$TAG' '$SITE_ADDRESS' > .env

          # The app's secrets, read by the INSTANCE role from Parameter Store.
          # They never pass through GitHub Actions, so no log can leak them.
          if ! aws ssm get-parameter --name '/$PROJECT/prod/env' --with-decryption \
               --region '$AWS_REGION' --query Parameter.Value --output text > .env.secrets; then
            echo "Could not read /$PROJECT/prod/env from Parameter Store." >&2
            echo "Create it first." >&2
            exit 1
          fi
          chmod 600 .env.secrets

          aws ecr get-login-password --region '$AWS_REGION' \
            | docker login --username AWS --password-stdin '$REGISTRY'
          # Fetch the new image first, so the swap below is quick.
          docker compose -f compose.yaml -f compose.prod.yaml pull
          # Recreate only what changed; --remove-orphans drops containers whose
          # service is no longer in the compose files.
          docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans
          # Stop old tags filling the disk. A rollback re-pulls from ECR.
          docker image prune -af
          # Final state into the log, so a failed deploy shows which container is unhealthy.
          docker compose -f compose.yaml -f compose.prod.yaml ps
          EOF

          # AWS-RunShellScript takes its commands as a JSON list of lines.
          # -R reads raw lines so nothing in the script is interpreted as JSON.
          jq -Rn '{commands: [inputs]}' < remote.sh > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $TAG" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command id: $CMD_ID"

          # send-command returns immediately, so poll for the outcome for a few
          # minutes: the built-in waiter might give up too early for image pulls.
          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          # Pull the instance's output into this log. Printed before the status
          # check, so a failed deploy still shows why it failed.
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy finished with status $STATUS"
            exit 1
          fi

          # Expose the IP as a step output (steps.<id>.outputs.ip) for later steps.
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # "The deploy command succeeded" is not the same as "the site answers".
      # Checks whatever users actually hit: once SITE_ADDRESS names a domain,
      # Caddy serves HTTPS there and 308s the bare IP to it, so curling the IP
      # would report a redirect rather than the app. Retries because containers
      # need a moment after `up -d`.
      #
      #   | code    | meaning                                    |
      #   |---------|--------------------------------------------|
      #   | 200/401 | serving (401 = behind the Caddy password)   |
      #   | 000     | nothing answered, or TLS not ready yet      |
      #   | 502     | Caddy is up, the app container is not       |
      - name: Check the site responds
        env:
          IP: ${{ steps.ssm.outputs.ip }}
          TAG: ${{ steps.tag.outputs.tag }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          URL="http://$IP/"
          [ -n "$SITE_ADDRESS" ] && URL="https://$SITE_ADDRESS/"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 5 --retry-delay 5 \
            --retry-all-errors "$URL" || echo 000)
          echo "HTTP $CODE from $URL"
          case "$CODE" in
            200|401) echo "### Deployed \`$TAG\` to $URL" >> "$GITHUB_STEP_SUMMARY" ;;
            502) echo "::error::Caddy answered but the app container is not healthy." \
                      "The docker compose ps output above shows which one."
                 exit 1 ;;
            000) echo "::error::$URL did not answer. If the domain was just set," \
                      "Caddy may still be obtaining its certificate."
                 exit 1 ;;
            *)   echo "::error::$URL returned HTTP $CODE."; exit 1 ;;
          esac
