[server]
headless = true
address = "127.0.0.1"
port = 8501
fileWatcherType = "auto"
runOnSave = true
folderWatchBlacklist = [".git", ".venv", ".cache", "results", "runtime"]

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1c5948"
backgroundColor = "#f4f3ec"
secondaryBackgroundColor = "#fbfbf7"
textColor = "#203731"
font = "sans serif"
