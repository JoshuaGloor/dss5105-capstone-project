[server]
headless = true
address = "127.0.0.1"
port = 8501
fileWatcherType = "auto"
runOnSave = true
folderWatchBlacklist = [".git", ".venv", ".cache", "results", "runtime"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1d1b18"
backgroundColor = "#faf8f4"
secondaryBackgroundColor = "#f3efe7"
textColor = "#1d1b18"
borderColor = "#e4ddd0"
font = "sans-serif"
headingFont = "serif"
baseRadius = "small"
linkColor = "#7d5e30"
blueColor = "#4a463f"
blueBackgroundColor = "#f3efe7"
blueTextColor = "#3d3933"
greenColor = "#2f5d46"
greenBackgroundColor = "#edf3ef"
greenTextColor = "#2f5d46"
yellowColor = "#a3804c"
yellowBackgroundColor = "#f8f1e3"
yellowTextColor = "#6e5229"
orangeColor = "#a3804c"
orangeBackgroundColor = "#f8f1e3"
orangeTextColor = "#6e5229"
redColor = "#8a2c35"
redBackgroundColor = "#f7ecec"
redTextColor = "#8a2c35"
